##
## Curex Platform — Local Docker Compose
##
## Service map:
##   nginx (443/80) → api-gateway (8080) → user-service (8081)
##                                        → notification-service (8082)
##
## In Kubernetes, Nginx is replaced by an Ingress controller and
## service discovery uses Kubernetes DNS (http://service-name:port).
##

services:
  # Infrastructure

  postgres:
    image: postgres:16-alpine
    container_name: curex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: curex_main
      POSTGRES_USER: ${DB_USERNAME:-curex_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-curex_password}
    ports:
      - "5433:5432" # host:5433 → container:5432 (avoids clash with local Postgres)
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-curex_user} -d curex_main"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: curex-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "5672:5672"
      - "15672:15672" # management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    container_name: curex-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/proxy_params.conf:/etc/nginx/proxy_params.conf:ro
    depends_on:
      api-gateway:
        condition: service_started

  # Application Services

  user-service:
    build:
      context: ./curex-be/services/user-service
      dockerfile: Dockerfile
    container_name: curex-user-service
    restart: unless-stopped
    expose:
      - "8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/curex_users
      DB_USERNAME: ${DB_USERNAME:-curex_user}
      DB_PASSWORD: ${DB_PASSWORD:-curex_password}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-900000}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-604800000}
      SERVICES_APPOINTMENT_URL: ${SERVICES_APPOINTMENT_URL}
      SERVICES_DOCTOR_URL: ${SERVICES_DOCTOR_URL}
      SERVICES_PATIENT_URL: ${SERVICES_PATIENT_URL}
      SERVICES_PAYMENT_URL: ${SERVICES_PAYMENT_URL}
      SERVICES_NOTIFICATION_URL: ${SERVICES_NOTIFICATION_URL}
      SERVICES_REPORT_URL: ${SERVICES_REPORT_URL}
      SERVICES_TELEMEDICINE_URL: ${SERVICES_TELEMEDICINE_URL}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "curl -f http://localhost:8081/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  notification-service:
    build:
      context: ./curex-be/services/notification-service
      dockerfile: Dockerfile
    container_name: curex-notification-service
    restart: unless-stopped
    expose:
      - "8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/curex_notifications
      DB_USERNAME: ${DB_USERNAME:-curex_user}
      DB_PASSWORD: ${DB_PASSWORD:-curex_password}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      NOTIFICATION_EMAIL_FROM: ${NOTIFICATION_EMAIL_FROM:-noreply@curex.com}
      TEXT_LK_API_TOKEN: ${TEXT_LK_API_TOKEN:-}
      TEXT_LK_SENDER_ID: ${TEXT_LK_SENDER_ID:-CUREX}
      TEXT_LK_API_BASE_URL: ${TEXT_LK_API_BASE_URL:-https://app.text.lk/api/v3}
      USER_SERVICE_BASE_URL: http://user-service:8081
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "curl -f http://localhost:8082/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  telemedicine-service:
    build:
      context: ./curex-be/services/telemedicine-service
      dockerfile: Dockerfile
    container_name: curex-telemedicine-service
    restart: unless-stopped
    expose:
      - "8089"
    ports:
      - "8089:8089"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/curex_telemed
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-curex_user}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-curex_password}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      SERVICES_APPOINTMENT_URL: ${SERVICES_APPOINTMENT_URL:-http://appointment-service:8088}
      TELEMEDICINE_STUB_MODE: ${TELEMEDICINE_STUB_MODE:-true}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "curl -f http://localhost:8089/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  patient-service:
    build:
      context: ./curex-be/services/patient-service
      dockerfile: Dockerfile
    container_name: curex-patient-service
    restart: unless-stopped
    expose:
      - "8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/curex_patients
      DB_USERNAME: ${DB_USERNAME:-curex_user}
      DB_PASSWORD: ${DB_PASSWORD:-curex_password}
      SERVICES_DOCTOR_URL: http://doctor-service:8084
    depends_on:
      postgres:
        condition: service_healthy
      doctor-service:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "curl -f http://localhost:8083/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  doctor-service:
    build:
      context: ./curex-be/services/doctor-service
      dockerfile: Dockerfile
    container_name: curex-doctor-service
    restart: unless-stopped
    expose:
      - "8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/curex_doctors
      DB_USERNAME: ${DB_USERNAME:-curex_user}
      DB_PASSWORD: ${DB_PASSWORD:-curex_password}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      SERVICES_APPOINTMENT_URL: ${SERVICES_APPOINTMENT_URL:-http://appointment-service:8088}
      SERVICES_USER_URL: ${SERVICES_USER_URL:-http://user-service:8081}
      CUREX_PRESCRIPTION_STATUS_ZONE: ${CUREX_PRESCRIPTION_STATUS_ZONE:-Asia/Colombo}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      user-service:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "curl -f http://localhost:8084/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  appointment-service:
    build:
      context: ./curex-be/services/appointment/appointment-service
      dockerfile: Dockerfile
    container_name: curex-appointment-service
    restart: unless-stopped
    expose:
      - "8088"
    ports:
      - "8088:8088"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/curex_appointments
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-curex_user}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-curex_password}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      APPOINTMENT_STUB_MODE: ${APPOINTMENT_STUB_MODE:-true}
      SERVICES_DOCTOR_URL: ${SERVICES_DOCTOR_URL:-http://doctor-service:8084}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      doctor-service:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "curl -f http://localhost:8088/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  payment-service:
    build:
      context: ./curex-be/services/payment-service
      dockerfile: Dockerfile
    container_name: curex-payment-service
    restart: unless-stopped
    expose:
      - "8087"
    ports:
      - "8087:8087"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/curex_payments
      DB_USER: ${DB_USERNAME:-curex_user}
      DB_PASSWORD: ${DB_PASSWORD:-curex_password}
      RABBIT_HOST: rabbitmq
      RABBIT_USER: ${RABBITMQ_USERNAME:-guest}
      RABBIT_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_SUCCESS_URL: ${STRIPE_SUCCESS_URL:-http://localhost:5173/payment/success}
      STRIPE_CANCEL_URL: ${STRIPE_CANCEL_URL:-http://localhost:5173/payment/cancel}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "curl -f http://localhost:8087/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  ai-symptom-service:
    build:
      context: ./curex-be/services/ai-symptom-service
      dockerfile: Dockerfile
    container_name: curex-ai-symptom-service
    restart: unless-stopped
    expose:
      - "8085"
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      AI_PROVIDER: ${AI_PROVIDER:-groq}
      AI_MODEL: ${AI_MODEL:-llama-3.1-8b-instant}
    healthcheck:
      test:
        ["CMD-SHELL", "curl -f http://localhost:8085/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  report-service:
    build:
      context: ./curex-be/services/report-service
      dockerfile: Dockerfile
    container_name: curex-report-service
    restart: unless-stopped
    expose:
      - "8086"
    ports:
      - "8086:8086"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/curex_reports
      DB_USERNAME: ${DB_USERNAME:-curex_user}
      DB_PASSWORD: ${DB_PASSWORD:-curex_password}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "curl -f http://localhost:8086/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  api-gateway:
    build:
      context: ./curex-be/api-gateway
      dockerfile: Dockerfile
    container_name: curex-api-gateway
    restart: unless-stopped
    expose:
      - "8080"
    ports:
      - "8080:8080" # remove in production (traffic only via nginx)
    environment:
      JWT_SECRET: ${JWT_SECRET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
    depends_on:
      user-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      telemedicine-service:
        condition: service_healthy
      appointment-service:
        condition: service_healthy
      patient-service:
        condition: service_healthy
      doctor-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      ai-symptom-service:
        condition: service_healthy
      report-service:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

volumes:
  postgres_data:
  rabbitmq_data:
