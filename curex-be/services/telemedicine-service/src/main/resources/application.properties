# Server
server.port=8089
spring.application.name=telemedicine-service

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5436/telemed_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:secret}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# RabbitMQ
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:admin}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:password}

# Feign
services.appointment.url=${SERVICES_APPOINTMENT_URL:http://localhost:8088}
curex.feign.appointment-service.user-id=${CUREX_FEIGN_APPOINTMENT_USER_ID:telemedicine-service-internal}
curex.feign.appointment-service.user-role=${CUREX_FEIGN_APPOINTMENT_USER_ROLE:ADMIN}

# Stub mode skips appointment-service calls (no PATCH to COMPLETED). Use false in deployed environments.
telemedicine.stub-mode=${TELEMEDICINE_STUB_MODE:false}

# Telemedicine room URL base
telemedicine.jitsi-base-url=${TELEMEDICINE_JITSI_BASE_URL:https://meet.jit.si}

# OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Health checks (avoid failing app health due transient RabbitMQ probe issues)
management.endpoint.health.probes.enabled=true
management.health.rabbit.enabled=false

# Logging
logging.level.com.healthcare.telemedicine=DEBUG
logging.level.org.springframework.amqp=WARN
