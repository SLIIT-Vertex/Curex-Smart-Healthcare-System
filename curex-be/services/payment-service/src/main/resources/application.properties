spring.application.name=payment-service
server.port=8087

# ===============================
# Database (PostgreSQL) - placeholders for local/dev
# ===============================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5436}/${DB_NAME:payment_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:rasanga}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# RabbitMQ - placeholders for local/dev
# ===============================
spring.rabbitmq.host=${RABBIT_HOST:localhost}
spring.rabbitmq.port=${RABBIT_PORT:5672}
spring.rabbitmq.username=${RABBIT_USER:guest}
spring.rabbitmq.password=${RABBIT_PASSWORD:guest}

# ===============================
# Stripe (TEST MODE)
# ===============================
# Use Stripe test keys like: sk_test_...
stripe.secret-key=${STRIPE_SECRET_KEY:}
# Webhook signing secret like: whsec_...
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}

# Frontend URLs for redirect after Checkout
stripe.success-url=${STRIPE_SUCCESS_URL:http://localhost:5173/payment/success}
stripe.cancel-url=${STRIPE_CANCEL_URL:http://localhost:5173/payment/cancel}

# Optional: API base path for gateway later
# server.servlet.context-path=/payment
