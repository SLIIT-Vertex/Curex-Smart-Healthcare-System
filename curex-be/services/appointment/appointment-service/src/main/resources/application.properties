#  Server 
server.port=8088
spring.application.name=appointment-service

#  Database 
# Override via env-var: SPRING_DATASOURCE_URL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/appointment_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:secret}
spring.datasource.driver-class-name=org.postgresql.Driver

#  JPA / Hibernate 
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

#  RabbitMQ 
# Override via env-var: SPRING_RABBITMQ_HOST
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:admin}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:password}

# RabbitMQ listener – continue even if broker not available at startup
spring.rabbitmq.listener.simple.missing-queues-fatal=false

#  Feign Client 
services.doctor.url=${SERVICES_DOCTOR_URL:http://localhost:8084}

#  Stub Mode 
# Set to true to skip Feign calls to doctor-service (for isolated testing)
appointment.stub-mode=${APPOINTMENT_STUB_MODE:false}

#  Appointment Status Transition 
# Frequency for auto transition CONFIRMED -> IN_SESSION once start time is reached.
appointment.status-transition.interval-ms=${APPOINTMENT_STATUS_TRANSITION_INTERVAL_MS:30000}
appointment.status-transition.initial-delay-ms=${APPOINTMENT_STATUS_TRANSITION_INITIAL_DELAY_MS:5000}
# Ensure transition time checks use the intended local zone (important in Docker).
appointment.status-transition.zone=${APPOINTMENT_STATUS_TRANSITION_ZONE:Asia/Colombo}

#  Swagger UI 
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

#  Actuator / Health 
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.rabbit.enabled=false

#  Logging 
logging.level.com.healthcare.appointment=INFO
logging.level.org.springframework.amqp=WARN
