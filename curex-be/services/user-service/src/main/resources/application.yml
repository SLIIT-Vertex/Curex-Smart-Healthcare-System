server:
  port: 8081

spring:
  application:
    name: user-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/curex_users}
    username: ${DB_USERNAME:curex_user}
    password: ${DB_PASSWORD:curex_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000
      leak-detection-threshold: 60000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    template:
      retry:
        enabled: true
        initial-interval: 1000
        max-attempts: 3
        multiplier: 2

# JWT_SECRET MUST be set via environment variable.
# Minimum 64 characters for HS512. Generate: openssl rand -base64 64
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:900000}
  refresh:
    expiration: ${JWT_REFRESH_EXPIRATION:604800000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.curex.user: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

services:
  appointment:
    url: ${SERVICES_APPOINTMENT_URL}
  doctor:
    url: ${SERVICES_DOCTOR_URL}
  patient:
    url: ${SERVICES_PATIENT_URL}
  payment:
    url: ${SERVICES_PAYMENT_URL}
  notification:
    url: ${SERVICES_NOTIFICATION_URL}
  report:
    url: ${SERVICES_REPORT_URL}
  telemedicine:
    url: ${SERVICES_TELEMEDICINE_URL}
