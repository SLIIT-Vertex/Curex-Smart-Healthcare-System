server:
  port: 8082

spring:
  application:
    name: notification-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/curex_notifications}
    username: ${DB_USERNAME:curex_user}
    password: ${DB_PASSWORD:curex_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 1000
          max-attempts: 3
          multiplier: 2

  task:
    execution:
      pool:
        core-size: 5
        max-size: 20
        queue-capacity: 100

# Text.lk SMS Gateway (https://app.text.lk)
# Set TEXT_LK_API_TOKEN and TEXT_LK_SENDER_ID in environment.
textlk:
  api-token: ${TEXT_LK_API_TOKEN:}
  api-base-url: ${TEXT_LK_API_BASE_URL:https://app.text.lk/api/v3}
  sender-id: ${TEXT_LK_SENDER_ID:CUREX}

notification:
  email:
    from: ${NOTIFICATION_EMAIL_FROM:noreply@curex.com}
    from-name: ${NOTIFICATION_EMAIL_FROM_NAME:Curex}

services:
  user-service:
    base-url: ${USER_SERVICE_BASE_URL:http://localhost:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
  health:
    mail:
      enabled: false

logging:
  level:
    com.curex.notification: INFO
    org.springframework.amqp: WARN
    org.springframework.mail: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
