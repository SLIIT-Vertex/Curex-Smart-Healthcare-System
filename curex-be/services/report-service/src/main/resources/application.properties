spring.application.name=report-service
server.port=8086

# ===============================
# Database (PostgreSQL) - placeholders for local/dev
# ===============================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5435}/${DB_NAME:report_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:rasanga}

# Explicit dialect makes startup errors clearer if DB is temporarily down
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# File upload
# ===============================
file.upload-dir=uploads/reports

# Reasonable defaults for demo uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
