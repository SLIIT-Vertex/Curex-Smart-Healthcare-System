server:
  port: 8084

spring:
  application:
    name: doctor-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/curex_doctors}
    username: ${DB_USERNAME:curex_user}
    password: ${DB_PASSWORD:curex_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000
      leak-detection-threshold: 60000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    template:
      retry:
        enabled: true
        initial-interval: 1000
        max-attempts: 3
        multiplier: 2

# Downstream / cross-service URLs for Feign
services:
  appointment:
    url: ${SERVICES_APPOINTMENT_URL:http://localhost:8088}
  user:
    url: ${SERVICES_USER_URL:http://localhost:8081}

# Identity forwarded on Feign calls to appointment-service (mirrors API gateway headers).
curex:
  feign:
    appointment-service:
      user-id: ${CUREX_APPOINTMENT_FEIGN_USER_ID:doctor-service-internal}
      user-role: ${CUREX_APPOINTMENT_FEIGN_USER_ROLE:ADMIN}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.curex.doctor: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
