events {
    worker_connections 1024;
}

http {
    # ── Upstream: Spring Cloud Gateway (single entry point) ──────────────────
    # All routing logic lives in the gateway. Nginx only handles:
    #   - SSL termination (when certs are added)
    #   - Security headers
    #   - Rate limiting per IP
    #   - Gzip compression
    upstream spring_gateway {
        server api-gateway:8080;
        keepalive 32;
    }

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api_limit:10m  rate=20r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

    server {
        listen 80;
        server_name localhost;

        # ── Security headers ────────────────────────────────────────────────
        add_header X-Frame-Options            DENY                          always;
        add_header X-Content-Type-Options     nosniff                       always;
        add_header X-XSS-Protection           "1; mode=block"               always;
        add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security  "max-age=31536000; includeSubDomains" always;

        # ── Nginx health check (no upstream call) ───────────────────────────
        location = /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # ── Auth routes (stricter rate limit — prevents brute force) ────────
        location /api/auth/login {
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_pass http://spring_gateway;
            include /etc/nginx/proxy_params.conf;
        }

        location /api/auth/register {
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_pass http://spring_gateway;
            include /etc/nginx/proxy_params.conf;
        }

        # ── All other API traffic → Spring Gateway ──────────────────────────
        location / {
            limit_req zone=api_limit burst=40 nodelay;
            proxy_pass http://spring_gateway;
            include /etc/nginx/proxy_params.conf;
        }
    }

    # ── Shared settings ─────────────────────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    client_max_body_size 10M;

    # Gzip compression
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        image/svg+xml;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;
}
