# ─────────────────────────────────────────────────────────────────────────────
# Curex Ingress — replaces Nginx from docker-compose
#
# Requires NGINX Ingress Controller installed in your cluster:
#   kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.10.1/deploy/static/provider/cloud/deploy.yaml
#
# For local dev with minikube:
#   minikube addons enable ingress
#
# For local dev with kind:
#   kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.10.1/deploy/static/provider/kind/deploy.yaml
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: curex-ingress
  namespace: curex
  labels:
    app.kubernetes.io/part-of: curex-healthcare
  annotations:
    # NGINX Ingress Controller
    kubernetes.io/ingress.class: "nginx"

    # ── Rate limiting (replaces nginx.conf rate limits) ───────────────────────
    # Global: 20 req/s per IP
    nginx.ingress.kubernetes.io/limit-rps: "20"
    # Auth endpoints: 5 req/s (applied via separate Ingress rule below)

    # ── Timeouts ──────────────────────────────────────────────────────────────
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "10"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"

    # ── Body size (for file uploads in future services) ───────────────────────
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"

    # ── CORS (gateway also handles CORS, this is a belt-and-suspenders) ───────
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "http://localhost:3000,http://localhost:5173"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, PATCH, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Authorization, Content-Type, X-Requested-With"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
    nginx.ingress.kubernetes.io/cors-max-age: "3600"

    # ── SSL redirect (enable when TLS is configured) ─────────────────────────
    # nginx.ingress.kubernetes.io/ssl-redirect: "true"

spec:
  # ── TLS (uncomment and configure when you have a domain + cert-manager) ────
  # tls:
  #   - hosts:
  #       - api.curex.com
  #     secretName: curex-tls-secret

  rules:
    # ── Replace "api.curex.com" with your domain, or use "_" for local dev ────
    - host: api.curex.com    # change to your domain; remove for local testing
      http:
        paths:
          # All API traffic → API Gateway
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
          # Actuator health (ops/monitoring)
          - path: /actuator
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080

---
# ── Stricter rate limit for auth endpoints ────────────────────────────────────
# Separate Ingress to override the global rate limit for login/register
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: curex-ingress-auth-ratelimit
  namespace: curex
  labels:
    app.kubernetes.io/part-of: curex-healthcare
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/limit-rps: "5"   # 5 req/s for auth paths
spec:
  rules:
    - host: api.curex.com
      http:
        paths:
          - path: /api/auth/login
            pathType: Exact
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
          - path: /api/auth/register
            pathType: Exact
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
