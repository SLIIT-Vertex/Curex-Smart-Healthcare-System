---
# Appointment Service — Deployment + ClusterIP Service
# Image: docker build -t curex-appointment-service:latest ./curex-be/services/appointment/appointment-service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: appointment-service
  namespace: curex
  labels:
    app: appointment-service
    app.kubernetes.io/part-of: curex-healthcare
spec:
  replicas: 1
  selector:
    matchLabels:
      app: appointment-service
  template:
    metadata:
      labels:
        app: appointment-service
    spec:
      enableServiceLinks: false
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z postgres 5432; do sleep 2; done']
        - name: wait-for-rabbitmq
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z rabbitmq 5672; do sleep 2; done']
        - name: wait-for-doctor-service
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z doctor-service 8084; do sleep 2; done']
      containers:
        - name: appointment-service
          image: curex-appointment-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8088
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/curex_appointments
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: curex-secrets
                  key: db-username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: curex-secrets
                  key: db-password
            - name: SPRING_RABBITMQ_HOST
              valueFrom:
                configMapKeyRef:
                  name: curex-config
                  key: RABBITMQ_HOST
            - name: SPRING_RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: curex-secrets
                  key: rabbitmq-username
            - name: SPRING_RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: curex-secrets
                  key: rabbitmq-password
            - name: SERVICES_DOCTOR_URL
              value: http://doctor-service:8084
            - name: APPOINTMENT_STUB_MODE
              value: "false"
            - name: SPRING_PROFILES_ACTIVE
              value: docker
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          startupProbe:
            tcpSocket:
              port: 8088
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: 8088
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: 8088
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5

---
apiVersion: v1
kind: Service
metadata:
  name: appointment-service
  namespace: curex
  labels:
    app: appointment-service
    app.kubernetes.io/part-of: curex-healthcare
spec:
  type: ClusterIP
  selector:
    app: appointment-service
  ports:
    - port: 8088
      targetPort: 8088
      protocol: TCP
