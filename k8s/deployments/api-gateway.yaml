---
# 
# API Gateway — Deployment + ClusterIP Service
# The gateway is the only service exposed externally (via Ingress).
# 
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: curex
  labels:
    app: api-gateway
    app.kubernetes.io/part-of: curex-healthcare
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      initContainers:
        - name: wait-for-user-service
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z user-service 8081; do
                echo "Waiting for user-service..."; sleep 3;
              done
        - name: wait-for-notification-service
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z notification-service 8082; do
                echo "Waiting for notification-service..."; sleep 3;
              done
      containers:
        - name: api-gateway
          image: your-registry/curex-api-gateway:latest   # ← update this
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: curex-secrets
                  key: jwt-secret
            - name: ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: curex-config
                  key: ALLOWED_ORIGINS
            - name: SPRING_PROFILES_ACTIVE
              value: docker
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: curex
  labels:
    app: api-gateway
    app.kubernetes.io/part-of: curex-healthcare
spec:
  type: ClusterIP   # exposed externally only via Ingress — not directly
  selector:
    app: api-gateway
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
