---
#
# API Gateway — Deployment + ClusterIP Service
# The gateway is the only service exposed externally (via Ingress).
#
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: curex
  labels:
    app: api-gateway
    app.kubernetes.io/part-of: curex-healthcare
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      enableServiceLinks: false
      initContainers:
        - name: wait-for-user-service
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z user-service 8081; do sleep 3; done']
        - name: wait-for-notification-service
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z notification-service 8082; do sleep 3; done']
      containers:
        - name: api-gateway
          image: curex-api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: curex-secrets
                  key: jwt-secret
            - name: ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: curex-config
                  key: ALLOWED_ORIGINS
            - name: SPRING_PROFILES_ACTIVE
              value: docker
          resources:
            requests:
              cpu: "100m"
              memory: "192Mi"
            limits:
              cpu: "500m"
              memory: "384Mi"
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5

---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: curex
  labels:
    app: api-gateway
    app.kubernetes.io/part-of: curex-healthcare
spec:
  type: ClusterIP
  selector:
    app: api-gateway
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
