---
# AI Symptom Service — Deployment + ClusterIP Service (stateless, no DB)
# Image: docker build -t curex-ai-symptom-service:latest ./curex-be/services/ai-symptom-service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-symptom-service
  namespace: curex
  labels:
    app: ai-symptom-service
    app.kubernetes.io/part-of: curex-healthcare
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-symptom-service
  template:
    metadata:
      labels:
        app: ai-symptom-service
    spec:
      enableServiceLinks: false
      containers:
        - name: ai-symptom-service
          image: curex-ai-symptom-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8085
          env:
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: curex-secrets
                  key: groq-api-key
                  optional: true
            - name: AI_PROVIDER
              value: groq
            - name: AI_MODEL
              value: llama-3.1-8b-instant
            - name: SPRING_PROFILES_ACTIVE
              value: docker
          resources:
            requests:
              cpu: "50m"
              memory: "192Mi"
            limits:
              cpu: "300m"
              memory: "384Mi"
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8085
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 20
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8085
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8085
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5

---
apiVersion: v1
kind: Service
metadata:
  name: ai-symptom-service
  namespace: curex
  labels:
    app: ai-symptom-service
    app.kubernetes.io/part-of: curex-healthcare
spec:
  type: ClusterIP
  selector:
    app: ai-symptom-service
  ports:
    - port: 8085
      targetPort: 8085
      protocol: TCP
