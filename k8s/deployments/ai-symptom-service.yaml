---
# ─────────────────────────────────────────────────────────────────────────────
# AI Symptom Service — Deployment + ClusterIP Service (stateless, no DB)
# Image: docker build -t your-registry/curex-ai-symptom-service:latest ./curex-be/services/ai-symptom-service
# Uses Groq Cloud when GROQ_API_KEY is set; falls back to rule-based analysis when empty.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-symptom-service
  namespace: curex
  labels:
    app: ai-symptom-service
    app.kubernetes.io/part-of: curex-healthcare
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-symptom-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: ai-symptom-service
    spec:
      containers:
        - name: ai-symptom-service
          image: your-registry/curex-ai-symptom-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8085
          env:
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: curex-secrets
                  key: groq-api-key
                  optional: true
            - name: AI_PROVIDER
              value: groq
            - name: AI_MODEL
              value: llama-3.1-8b-instant
            - name: SPRING_PROFILES_ACTIVE
              value: docker
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8085
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8085
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: ai-symptom-service
  namespace: curex
  labels:
    app: ai-symptom-service
    app.kubernetes.io/part-of: curex-healthcare
spec:
  type: ClusterIP
  selector:
    app: ai-symptom-service
  ports:
    - port: 8085
      targetPort: 8085
      protocol: TCP
