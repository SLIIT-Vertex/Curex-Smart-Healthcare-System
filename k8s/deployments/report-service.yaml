---
#
# Report Service - Deployment + ClusterIP Service
# Image: docker build -t curex-report-service:latest ./curex-be/services/report-service
#
apiVersion: apps/v1
kind: Deployment
metadata:
  name: report-service
  namespace: curex
  labels:
    app: report-service
    app.kubernetes.io/part-of: curex-healthcare
spec:
  replicas: 1
  selector:
    matchLabels:
      app: report-service
  template:
    metadata:
      labels:
        app: report-service
    spec:
      enableServiceLinks: false
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z postgres 5432; do sleep 2; done']
      containers:
        - name: report-service
          image: curex-report-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8086
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/curex_reports
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: curex-secrets
                  key: db-username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: curex-secrets
                  key: db-password
            - name: CLOUDINARY_CLOUD_NAME
              valueFrom:
                secretKeyRef:
                  name: curex-secrets
                  key: cloudinary-cloud-name
            - name: CLOUDINARY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: curex-secrets
                  key: cloudinary-api-key
            - name: CLOUDINARY_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: curex-secrets
                  key: cloudinary-api-secret
            - name: SPRING_PROFILES_ACTIVE
              value: docker
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8086
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8086
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8086
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5

---
apiVersion: v1
kind: Service
metadata:
  name: report-service
  namespace: curex
  labels:
    app: report-service
    app.kubernetes.io/part-of: curex-healthcare
spec:
  type: ClusterIP
  selector:
    app: report-service
  ports:
    - port: 8086
      targetPort: 8086
      protocol: TCP
