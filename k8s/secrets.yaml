# 
# Curex — Kubernetes Secrets
#
# DO NOT commit real values. Use one of these approaches:
#
#   Option A — generate from .env and apply directly (never commit):
#     kubectl create secret generic curex-secrets -n curex \
#       --from-literal=db-username=curex_user \
#       --from-literal=db-password=curex_password \
#       --from-literal=jwt-secret="$(grep JWT_SECRET .env | cut -d= -f2-)" \
#       --from-literal=rabbitmq-username=guest \
#       --from-literal=rabbitmq-password=guest \
#       --from-literal=mail-username=your@gmail.com \
#       --from-literal=mail-password=your-app-password \
#       --from-literal=text-lk-api-token=your-token \
#       --dry-run=client -o yaml > k8s/secrets.yaml
#
#   Option B — use Sealed Secrets or External Secrets Operator in CI/CD.
#
# Values below are base64-encoded EXAMPLES for local dev only.
# Generate real ones: echo -n 'value' | base64
# 
apiVersion: v1
kind: Secret
metadata:
  name: curex-secrets
  namespace: curex
  labels:
    app.kubernetes.io/part-of: curex-healthcare
type: Opaque
data:
  # echo -n 'curex_user' | base64
  db-username: Y3VyZXhfdXNlcg==
  # echo -n 'curex_password' | base64
  db-password: Y3VyZXhfcGFzc3dvcmQ=
  # echo -n 'guest' | base64
  rabbitmq-username: Z3Vlc3Q=
  # echo -n 'guest' | base64
  rabbitmq-password: Z3Vlc3Q=
  # Replace with: echo -n 'your-64-char-jwt-secret' | base64
  jwt-secret: REPLACE_WITH_BASE64_JWT_SECRET
  # Replace with: echo -n 'your@gmail.com' | base64
  mail-username: REPLACE_WITH_BASE64_EMAIL
  # Replace with: echo -n 'your-app-password' | base64
  mail-password: REPLACE_WITH_BASE64_APP_PASSWORD
  # Replace with: echo -n 'your-textlk-token' | base64
  text-lk-api-token: REPLACE_WITH_BASE64_TEXTLK_TOKEN
