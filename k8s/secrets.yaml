#
# Curex — Kubernetes Secrets
#
# DO NOT commit real values. Use one of these approaches:
#
#   Option A — generate from .env and apply directly (never commit):
#     kubectl create secret generic curex-secrets -n curex \
#       --from-literal=db-username=curex_user \
#       --from-literal=db-password=curex_password \
#       --from-literal=jwt-secret="$(grep JWT_SECRET .env | cut -d= -f2-)" \
#       --from-literal=rabbitmq-username=guest \
#       --from-literal=rabbitmq-password=guest \
#       --from-literal=mail-username=your@gmail.com \
#       --from-literal=mail-password=your-app-password \
#       --from-literal=text-lk-api-token=your-token \
#       --dry-run=client -o yaml > k8s/secrets.yaml
